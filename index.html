<title>Elsewhere Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&display=swap">
<style>
/* Layout: screen index rail on the left, the 370x760 Figma phone centered; the phone uses the Figma palette in both themes */
:root{
  --page:#ece7e4; --page-ink:#3a3437; --page-mute:#7a7174; --page-line:#d8d0cc; --page-hi:#a54070;
  /* Figma tokens (app surface, theme-independent by design) */
  --bg:#f8f2f0; --card:#fffcfb; --line:#d9d1ca; --ink:#292524; --ink2:#302d29; --mute:#676157;
  --plum:#a54070; --pink:#d982ac; --blush:#ede0e8; --blush2:#ebd0e1; --sage:#e7eddf; --sage2:#dde6d9;
  --sand:#f2ecdf; --nav:#55594f; --ph:#a8a29e;
  --sans:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"DM Serif Display",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#1d191b;--page-ink:#ece4e7;--page-mute:#a89ea2;--page-line:#3a3337;--page-hi:#e391b8;color-scheme:dark}}
:root[data-theme="dark"]{--page:#1d191b;--page-ink:#ece4e7;--page-mute:#a89ea2;--page-line:#3a3337;--page-hi:#e391b8;color-scheme:dark}
html,body{height:100%}
body{background:var(--page);color:var(--page-ink);font-family:var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
.stage{min-height:100%;display:flex;gap:40px;align-items:center;justify-content:center;padding-block:20px}
.rail{width:240px;flex:none;align-self:center;display:flex;flex-direction:column;gap:18px}
.rail h1{font:700 22px/1 var(--sans);letter-spacing:-.01em;margin:0}
.rail p{margin:0;color:var(--page-mute);font-size:13px;line-height:1.45}
.rail h2{font:700 10.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--page-mute);margin:0 0 6px}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.rail li button{width:100%;text-align:left;display:flex;gap:10px;padding:5px 8px;border-radius:8px;font-size:13px;color:var(--page-ink)}
.rail li button span{color:var(--page-mute);font-variant-numeric:tabular-nums;width:18px;flex:none}
.rail li button:hover{background:color-mix(in srgb,var(--page-hi) 10%,transparent)}
.rail li button[aria-current="true"]{color:var(--page-hi);font-weight:700}
.rail .reset{align-self:flex-start;font-size:13px;font-weight:600;color:var(--page-hi);border:1px solid var(--page-line);padding:7px 12px;border-radius:999px}
.phone-wrap{flex:none;position:relative}
.phone{width:370px;height:760px;background:var(--bg);border-radius:30px;overflow:hidden;position:relative;color:var(--ink);box-shadow:0 1px 0 rgba(0,0,0,.04),0 24px 60px -20px rgba(80,30,50,.35);transform-origin:top left;font-family:var(--sans)}
@media (max-width:780px){.rail{display:none}}
@media (max-width:500px){
  body{padding:0}
  .stage{padding:0;min-height:100%;height:100%}
  .phone-wrap{width:100%;height:100%}
  .phone{width:100%;height:100%;border-radius:0;box-shadow:none;transform:none!important}
}
/* ---- app ---- */
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.status{height:34px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 20px;font:700 14px/18px var(--sans);color:var(--ink)}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 20px 20px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.hdr{display:flex;justify-content:space-between;align-items:center;min-height:30px}
.brand{font:700 22px/28px var(--sans);color:#29272a;letter-spacing:-.01em}
.round{width:30px;height:30px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.h1{font:600 30px/38px var(--sans);color:var(--plum);margin:0;letter-spacing:-.015em;text-wrap:balance}
.sub{font:400 14px/20px var(--sans);color:var(--mute);margin:6px 0 0}
.h2{font:700 18px/24px var(--sans);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px}
.serif{font-family:var(--serif);font-weight:400}
.btn{height:50px;border-radius:16px;background:var(--pink);color:var(--ink2);font:700 16px/21px var(--sans);display:flex;align-items:center;justify-content:center;gap:8px;width:100%;flex:none;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(.97)}.btn:active{transform:scale(.99)}
.btn[aria-disabled="true"]{opacity:.55}
.ghost{height:36px;font:700 15px/20px var(--sans);color:var(--mute);width:100%;display:flex;align-items:center;justify-content:center;gap:6px}
.chip{display:flex;align-items:center;gap:6px;background:var(--sand);border-radius:14px;height:32px;padding:0 8px;font:700 12px/16px var(--sans);color:#302c30}
.search{display:flex;align-items:center;gap:8px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);padding:0 14px;color:var(--mute)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:14px;color:var(--ink)}
.search input::placeholder{color:var(--mute)}
.thumb{background-size:cover;background-position:center;flex:none}
.seg{display:flex;gap:8px}
.seg button{flex:1;height:36px;border-radius:18px;background:var(--card);border:1px solid var(--line);font:700 13px/17px var(--sans);color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--sage);border-color:var(--sage);color:var(--ink)}
.tabs2{display:flex;gap:8px}
.tabs2 button{flex:1;height:38px;border-radius:16px;background:var(--card);border:1px solid var(--line);font:700 14px/18px var(--sans);color:var(--mute)}
.tabs2 button[aria-pressed="true"]{background:var(--blush);color:var(--plum)}
.nav{height:74px;flex:none;background:var(--sage2);display:flex;padding:18px 10px 0}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:39px;color:var(--nav);font:700 10px/13px var(--sans)}
.nav button[aria-current="true"]{color:var(--plum)}
.row{display:flex;align-items:center;gap:12px}
.av{border-radius:50%;background-size:cover;background-position:center;flex:none}
.box{width:24px;height:24px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none;color:var(--ink2)}
.box.on{background:var(--pink);border-color:var(--pink)}
.pick{width:100%;text-align:left;border-radius:16px;border:1px solid var(--line);background:var(--card);padding:10px 12px;display:flex;align-items:center;gap:12px;transition:background .15s,border-color .15s}
.pick.on{border-color:var(--pink);background:var(--blush)}
.err{font:600 13px/18px var(--sans);color:#b3261e;margin:0}
.ring{position:relative;width:120px;height:120px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .lab{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.catrow{display:flex;justify-content:space-between;font:700 14px/18px var(--sans);font-variant-numeric:tabular-nums}
.catrow span:last-child{color:var(--mute)}
.toast{position:absolute;left:20px;right:20px;bottom:88px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font:600 13px/18px var(--sans);display:flex;gap:8px;align-items:center;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:none}
.sheet-bg{position:absolute;inset:0;background:rgba(41,37,36,.35);z-index:15;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;border-radius:24px 24px 0 0;padding:20px;display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.screen-in{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.screen-in,.sheet{animation:none}.pulse{animation:none!important}}
/* map */
.map{position:relative;overflow:hidden;background:#d8e0cf}
.map i{position:absolute;display:block}
.pin{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translateX(0)}
.pin b{display:flex;align-items:center;gap:4px;height:22px;padding:0 8px 0 7px;border-radius:10px;font:700 9px/12px var(--sans);white-space:nowrap}
.pin b::before{content:"";width:6px;height:6px;border-radius:50%;background:#fffcfb}
.pin em{width:2px;height:6px}.pin u{width:4px;height:4px;border-radius:50%}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.ilist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ibtn{height:56px;border-radius:16px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:8px;padding:0 12px;font:700 14px/18px var(--sans);color:#302c30;text-align:left}
.ibtn.on{background:var(--blush2);border-color:var(--pink);color:var(--plum)}
.field{display:flex;align-items:center;gap:10px;height:48px;border-radius:16px;border:1px solid var(--line);background:#fff;padding:0 14px;color:var(--mute)}
.field input{border:0;outline:none;background:none;flex:1;min-width:0;font-size:15px;color:var(--ink)}
.field input::placeholder{color:var(--ph)}
.lbl{font:700 12px/17px var(--sans);color:var(--mute)}
.bubble{max-width:78%;padding:9px 12px;border-radius:16px;font:400 14px/19px var(--sans)}
.me{align-self:flex-end;background:var(--pink);color:var(--ink2);border-bottom-right-radius:4px}
.them{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.badge{display:inline-flex;align-items:center;gap:4px;background:var(--blush);color:var(--plum);border-radius:999px;padding:4px 8px;font:700 11px/14px var(--sans)}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:8px;height:8px;border-radius:50%;background:var(--pink);animation:bl 1s infinite alternate}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{to{opacity:.25}}
@media (prefers-reduced-motion:no-preference){.screen-in .trail{stroke-dasharray:1;animation:draw 1.6s ease-out .15s both}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.sec{display:flex;justify-content:space-between;align-items:center}
.ichip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:15px;background:var(--blush2);color:var(--plum);font:700 12px/16px var(--sans)}
.srow{display:flex;align-items:center;gap:12px;padding:12px 0}
.srow+.srow{border-top:1px solid #ede0e8}
</style>

<div class="stage">
  <aside class="rail" aria-label="Prototype screens">
    <div style="display:flex;flex-direction:column;gap:8px">
      <h1>Elsewhere</h1>
      <p>CS147 A6 revised prototype. Every control on the phone works; use this list to jump straight to a screen.</p>
    </div>
    <div id="railList"></div>
    <button class="reset" id="resetBtn">Reset prototype</button>
  </aside>
  <div class="phone-wrap" id="wrap"><div class="phone" id="phone"></div></div>
</div>

function visitStats(){const c={};S.visits.forEach(v=>c[v.p]=(c[v.p]||0)+1);const places=Object.keys(c);const top=places.sort((a,b)=>c[b]-c[a])[0];

function visitMap(){const {c}=visitStats();
  let s=`<svg viewBox="0 0 370 340" width="100%" style="display:block;border-radius:12px;background:#d8e0cf" role="img" aria-label="Map of places you've visited">`;

  for(const [k,[x,y]] of Object.entries(VPT)){const n=c[k]||0;const p=PLACES[k];

    <label class="lbl" for="em">Email</label>
    <div class="field">${ic('mail',18)}<input id="em" type="email" autocomplete="email" placeholder="you@example.com" value="${esc(S.email)}"></div>
    <label class="lbl" for="pw" style="margin-top:4px">Password</label>
    <div class="field">${ic('lock',18)}<input id="pw" type="${S.showPw?'text':'password'}" autocomplete="current-password" placeholder="••••••••" value="${esc(S.pw)}"><button type="button" data-act="togglePw" aria-label="${S.showPw?'Hide':'Show'} password" style="color:var(--mute);display:grid">${ic(S.showPw?'eye':'eye-off',18)}</button></div>
    ${S.loginErr?`<p class="err">${esc(S.loginErr)}</p>`:''}
    <button type="button" data-act="forgot" style="text-align:left;font:700 13px/18px var(--sans);color:var(--plum);margin-top:2px">Forgot password?</button>
  </form>
  <div style="display:flex;flex-direction:column;gap:12px"><button class="btn" data-act="login">Log in</button><button class="ghost" data-act="signup">Create an account</button></div>
</div>`;

V.interests=()=>`${status}<div class="body" style="gap:20px;padding-top:20px">
  ${hdr()}
  ${title('What are you into?',"Pick a few things you'd love to try.")}
  <div class="ilist">${INTERESTS.map(([n,i])=>`<button class="ibtn ${S.interests.includes(n)?'on':''}" data-int="${esc(n)}" aria-pressed="${S.interests.includes(n)}">${ic(i,16)}${n}</button>`).join('')}</div>
  <div style="flex:1"></div>
  <div style="display:flex;flex-direction:column;gap:12px">
    ${S.intErr?`<p class="err">Pick at least one interest to continue.</p>`:`<p class="sub" style="margin:0;font-size:13px">${S.interests.length?S.interests.length+' selected. ':''}You can change these later.</p>`}
    <button class="btn" data-act="toFriends">Continue → Choose Friends</button>
  </div>
</div>`;

V.onFriends=()=>{const q=S.friendQ.toLowerCase();const list=['maya','jess','alex','sophie'].filter(k=>PEOPLE[k].name.toLowerCase().includes(q)&&!(S.addMode&&S.friends.includes(k)));
 return `${status}<div class="body" style="gap:16px;padding-top:8px">
  ${hdr()}
  ${title('Better with friends.',"Add people you'd be open to exploring with.")}
  <label class="search" style="height:48px;border-radius:16px">${ic('search',18)}<input id="fq" placeholder="Search for friends..." value="${esc(S.friendQ)}" aria-label="Search for friends"></label>
  <div style="display:flex;flex-direction:column;gap:12px">${list.map(k=>{const on=S.onboardFriends.includes(k);return `<button class="pick ${on?'on':''}" data-of="${k}" style="border-radius:20px;height:76px" aria-pressed="${on}"><span class="av" style="width:52px;height:52px;background-image:${im(PEOPLE[k].img)}"></span><span style="flex:1"><b style="display:block;font:700 16px/21px var(--sans)">${PEOPLE[k].name}</b><span style="font:400 13px/18px var(--sans);color:var(--mute)">${on?'Selected':'Not selected'}</span></span><span class="box ${on?'on':''}">${on?ic('check',14,2.5):''}</span></button>`}).join('')||`<p class="sub">${S.addMode&&!q?'Everyone suggested is already your friend.':'No one matches “'+esc(S.friendQ)+'”.'}</p>`}</div>
 </div>
 <div style="flex:none;padding:16px 20px 20px;border-top:1px solid #e7e0dd;display:flex;flex-direction:column;gap:12px;background:var(--bg)">
  ${S.addMode?`<button class="ghost" data-act="back">Cancel</button><button class="btn" data-act="finishOnboard">Add to friends${S.onboardFriends.length?` (${S.onboardFriends.length})`:''}</button>`
  :`<button class="ghost" data-act="finishOnboard" data-skip="1">Skip for now</button><button class="btn" data-act="finishOnboard">Finish → Home${S.onboardFriends.length?` (${S.onboardFriends.length})`:''}</button>`}
 </div>`};

V.home=()=>{const picks=['matcha','gallery','bookstore'];return `${status}<div class="body" style="padding-top:16px">
  ${hdr()}
  ${title('You have 1 hour free!','A little opening. A new possibility.')}
  <button class="btn" data-act="toMap">Explore Nearby</button>
  ${(()=>{const st=visitStats();return `<button class="card row" data-tab="profile" style="text-align:left;width:100%;background:var(--sage);border-color:var(--sage)"><span style="width:44px;height:44px;border-radius:22px;background:var(--card);display:grid;place-items:center;color:var(--plum)">${ic('map',20)}</span><span style="flex:1"><b style="display:block;font:700 15px/20px var(--sans)">Your map: ${st.places} places, ${S.visits.length} visits</b><span style="font:400 12px/17px var(--sans);color:var(--mute)">See everywhere you've gone this month</span></span><span style="display:grid;transform:rotate(180deg);color:var(--mute)">${ic('chevron-left',16)}</span></button>`})()}
  <h2 class="h2">Quick picks for you</h2>
  <div style="display:flex;flex-direction:column;gap:10px">${picks.map(k=>{const p=PLACES[k];return `<button class="card row" data-place="${k}" style="padding:12px;text-align:left;width:100%"><span class="thumb" style="width:78px;height:76px;border-radius:12px;background-image:${im(p.thumb)}"></span><span style="display:flex;flex-direction:column;gap:6px"><span class="serif" style="font-size:20px;line-height:26px;color:var(--ink)">${p.name}</span><span style="font:400 12px/17px var(--sans);color:var(--mute)">${p.mins} mins away · ${p.price}</span></span></button>`}).join('')}</div>
  ${S.lastVisit?`<div class="chip" style="height:auto;padding:10px 12px;background:var(--sage)">${ic('calendar',16)}Next up: ${esc(S.lastVisit)}</div>`:''}
 </div>${nav()}`};

function visiblePlaces(){const q=S.mapQ.trim().toLowerCase(),f=S.filter;return Object.keys(PLACES).filter(k=>{const p=PLACES[k];return(!q||p.name.toLowerCase().includes(q))&&(!f.price.length||f.price.includes(p.price))&&p.mins<=f.walk})}
V.discover=()=>{const vis=visiblePlaces();const nf=S.filter.price.length+(S.filter.walk<15?1:0);const {c}=visitStats();const g=PLACES.golf;return `${status}<div class="body" style="padding-top:6px;gap:12px">
   ${hdr(`<button class="round" data-act="filters" aria-label="Filters" style="position:relative">${ic('sliders-horizontal',16)}${nf?`<span style="position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--plum);color:#fff;font:700 10px/16px var(--sans)">${nf}</span>`:''}</button>`)}
   ${title('Discover','Somewhere new within a short walk.')}
   <label class="search">${ic('search',16)}<input id="mq" placeholder="Search for places…" value="${esc(S.mapQ)}" aria-label="Search for places"></label>
   ${!S.mapQ&&!nf?`<button class="card" data-place="golf" style="text-align:left;display:flex;flex-direction:column;gap:6px;width:100%"><span class="thumb" style="height:100px;border-radius:12px;background-image:${im(g.big)}"></span><span class="row" style="justify-content:space-between"><span class="serif" style="font-size:23px;line-height:30px;color:var(--ink)">${g.name}</span>${c.golf?'':'<span class="badge">New to you</span>'}</span><span style="font:400 14px/20px var(--sans);color:var(--mute)">${g.tag} ${g.mins} min walk · ${g.price}</span></button>`:''}
   <h2 class="h2" style="font-size:16px">Nearby</h2>
   ${vis.length?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${vis.map(k=>{const p=PLACES[k];return `<button class="card" data-place="${k}" style="padding:10px;border-radius:16px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative"><span class="thumb" style="height:72px;border-radius:10px;background-image:${im(p.card||p.thumb)}"></span><span style="font:400 14px/18px var(--sans);color:var(--ink)">${p.name}</span><span style="display:flex;gap:4px;align-items:center;font:400 11px/14px var(--sans);color:var(--mute)">${ic('clock',12)}${p.mins} mins · ${p.price}</span><span style="font:700 11px/14px var(--sans);color:${c[k]?'var(--nav)':'var(--plum)'}">${c[k]?'Been '+c[k]+'×':'New to you'}</span></button>`}).join('')}</div>`
   :`<div class="card" style="text-align:center;color:var(--mute);font-size:14px;padding:20px">Nothing nearby matches. <button data-act="clearFilters" style="color:var(--plum);font-weight:700">Clear search and filters</button></div>`}
  </div>${nav()}`};

V.profile=()=>{const st=visitStats();const recent=[...S.visits].reverse();return `${status}<div class="body" style="padding-top:12px;gap:18px">
  ${hdr()}
  <div class="row"><span class="av" style="width:60px;height:60px;background-image:${im('301ffc')}"></span><span style="min-width:0"><h1 class="h1" style="font-size:26px;line-height:32px">${esc(displayName())}</h1><span style="font:400 13px/18px var(--sans);color:var(--mute)">${esc(S.email||'Stanford campus')}</span></span></div>

  <section style="display:flex;flex-direction:column;gap:10px">
   <div class="sec"><h2 class="h2">Your map</h2><div class="seg" style="width:140px" role="group" aria-label="Map view"><button data-mv="map" aria-pressed="${S.mapView==='map'}" style="height:30px">Map</button><button data-mv="list" aria-pressed="${S.mapView==='list'}" style="height:30px">List</button></div></div>
   <div class="card" style="display:flex;flex-direction:column;gap:10px">
    ${S.mapView==='map'?visitMap()+`<p style="margin:0;font:400 12px/17px var(--sans);color:var(--mute)">Bigger circles are places you return to. The line follows the order you went. Dashed circles are still new to you.</p>`
    :`<div style="display:flex;flex-direction:column">${recent.map(v=>{const p=PLACES[v.p];return `<button class="srow" data-place="${v.p}" style="text-align:left;width:100%"><span class="thumb" style="width:44px;height:44px;border-radius:10px;background-image:${im(p.thumb)}"></span><span style="flex:1"><b style="display:block;font:700 14px/19px var(--sans)">${p.name}</b><span style="font:400 12px/16px var(--sans);color:var(--mute)">${v.d}${v.w?' · with '+PEOPLE[v.w].name:' · solo'}</span></span></button>`}).join('')}</div>`}
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center">
     <div style="background:var(--sand);border-radius:14px;padding:8px 4px"><b style="display:block;font:700 18px/22px var(--sans);font-variant-numeric:tabular-nums">${st.places}</b><span style="font:400 11px/14px var(--sans);color:var(--mute)">places</span></div>
     <div style="background:var(--sand);border-radius:14px;padding:8px 4px"><b style="display:block;font:700 18px/22px var(--sans);font-variant-numeric:tabular-nums">${(st.mins/60).toFixed(1)}h</b><span style="font:400 11px/14px var(--sans);color:var(--mute)">out exploring</span></div>
     <div style="background:var(--sand);border-radius:14px;padding:8px 4px"><b style="display:block;font:700 18px/22px var(--sans);font-variant-numeric:tabular-nums">${st.withF}</b><span style="font:400 11px/14px var(--sans);color:var(--mute)">with friends</span></div>
    </div>
    <p style="margin:0;font:400 13px/18px var(--sans);color:var(--ink)">Your spot: <b>${PLACES[st.top].name}</b>, ${st.c[st.top]} visits.</p>
   </div>
  </section>

  <section style="display:flex;flex-direction:column;gap:10px">
   <div class="sec"><h2 class="h2">Interests</h2><button data-act="editInterests" style="font:700 13px/18px var(--sans);color:var(--plum)">Edit</button></div>
   <div class="card" style="display:flex;flex-wrap:wrap;gap:8px">${S.interests.length?S.interests.map(n=>{const i=INTERESTS.find(x=>x[0]===n);return `<span class="ichip">${ic(i[1],14)}${n}</span>`}).join(''):`<span style="font:400 13px/18px var(--sans);color:var(--mute)">No interests yet. Add a few so picks fit you.</span>`}</div>
  </section>

  <section style="display:flex;flex-direction:column;gap:10px">
   <h2 class="h2">Calendar</h2>
   <div class="card" style="padding:4px 12px">
    <div class="srow"><span style="width:36px;height:36px;border-radius:18px;background:var(--sage);display:grid;place-items:center">${ic('calendar',18)}</span><span style="flex:1"><b style="display:block;font:700 14px/19px var(--sans)">Sync my calendar</b><span style="font:400 12px/16px var(--sans);color:var(--mute)">${S.calSync?'Free time today: 3:00–4:00pm':'Turn on to find your free hours'}</span></span>${toggle('calSync',S.calSync,'Sync my calendar')}</div>
    ${S.plans.length?S.plans.map((pl,i)=>`<div class="srow"><span class="thumb" style="width:36px;height:36px;border-radius:10px;background-image:${im(PLACES[pl.p].thumb)}"></span><span style="flex:1;min-width:0"><b style="display:block;font:700 14px/19px var(--sans)">${PLACES[pl.p].name}</b><span style="font:400 12px/16px var(--sans);color:var(--mute)">${pl.when}${pl.w?' · with '+PEOPLE[pl.w].name:''}</span></span>${pl.cal?`<span class="badge">${ic('check',12,2.5)}Added</span>`:`<button class="chip" data-addcal="${i}" style="padding:0 10px">${ic('calendar-plus',14)}Add</button>`}</div>`).join('')
     :`<div class="srow"><span style="font:400 13px/18px var(--sans);color:var(--mute)">No plans yet. Plans you confirm show up here.</span></div>`}
   </div>
  </section>

  <section style="display:flex;flex-direction:column;gap:10px">
   <h2 class="h2">Settings</h2>
   <div class="card" style="padding:4px 12px">
    <div class="srow"><span style="flex:1;font:700 14px/19px var(--sans)">Free-time nudges</span>${toggle('notif',S.notif,'Free-time nudges')}</div>
    <div class="srow"><button data-tab="budget" style="flex:1;text-align:left;font:700 14px/19px var(--sans)">Spending budget</button><span style="font:400 13px/18px var(--sans);color:var(--mute)">${money(S.budget.amt[S.budget.freq])} ${FREQ[S.budget.freq].per}</span></div>
   </div>
   <button class="ghost" data-act="logout">${ic('log-out',16)}Log out</button>
  </section>
 </div>${nav()}`};

V.editInterests=()=>`${status}<div class="body" style="gap:20px;padding-top:12px">
  ${hdr(backBtn)}
  ${title('Edit interests','Picks on Home and Discover follow these.')}
  <div class="ilist">${INTERESTS.map(([n,i])=>`<button class="ibtn ${S.intDraft.includes(n)?'on':''}" data-intd="${esc(n)}" aria-pressed="${S.intDraft.includes(n)}">${ic(i,16)}${n}</button>`).join('')}</div>
  ${S.intErr?`<p class="err">Keep at least one interest.</p>`:''}
  <div style="flex:1"></div>
  <button class="btn" data-act="saveInterests">Save interests</button>
 </div>${nav()}`;

V.explore=()=>{const p=PLACES[S.place];return `${status}<div class="body" style="padding-top:16px">
  ${hdr(backBtn)}
  <div style="display:flex;flex-direction:column;gap:6px"><h1 class="h1">Explore</h1>
  <button class="search" data-act="toMap" style="width:100%">${ic('search',16)}<span style="font-size:14px">Search for places…</span></button></div>
  <div class="card" style="display:flex;flex-direction:column;gap:8px">
   <div style="border-radius:12px;overflow:hidden">${mapHTML(306,100,306/370,-70,{interactive:false,highlight:S.place})}</div>
   <div class="serif" style="font-size:23px;line-height:30px">Stanford campus</div>
   <div style="font:400 14px/20px var(--sans);color:var(--mute)">${p.name} — ${p.mins} mins away · ${p.price}</div>
  </div>
  <div class="card" style="display:flex;flex-direction:column;gap:8px">
   <div class="thumb" style="height:100px;border-radius:12px;background-image:${im(p.big)}"></div>
   <div class="serif" style="font-size:23px;line-height:30px">${p.name}</div>
   <div style="font:400 14px/20px var(--sans);color:var(--mute);margin-top:-2px">${p.tag}</div>
   <button class="btn" data-act="plan">Plan a Visit</button>
  </div></div>${nav()}`};

V.hangout=()=>{const p=PLACES[S.place];const opt=(k,icon,t,d,bg)=>{const on=S.mode===k;return `<button class="pick ${on?'on':''}" data-mode="${k}" aria-pressed="${on}" style="height:64px"><span style="width:40px;height:40px;border-radius:20px;background:${on?'var(--pink)':bg};display:grid;place-items:center;flex:none">${ic(icon,18)}</span><span style="flex:1"><b style="display:block;font:700 15px/20px var(--sans)">${t}</b><span style="font:400 12px/16px var(--sans);color:var(--mute)">${d}</span></span>${on?`<span class="box on" style="width:20px;height:20px">${ic('check',12,2.5)}</span>`:''}</button>`};
 return `${status}<div class="body" style="gap:10px;padding-top:8px">
  ${hdr(backBtn)}
  ${title('Who would you like to go with?','A little adventure nearby.')}
  <div class="card" style="display:flex;flex-direction:column;gap:8px"><div class="thumb" style="height:100px;border-radius:12px;background-image:${im(p.big)}"></div><div class="serif" style="font-size:23px;line-height:30px">${p.name}</div><div class="chip">${ic('clock',16)}${p.mins} min walk · ${p.price} · ${p.dur}</div></div>
  <div class="card" style="display:flex;flex-direction:column;gap:8px"><div><b style="font:700 16px/21px var(--sans)">Choose a vibe</b><div style="font:400 13px/18px var(--sans);color:var(--mute)">Pick how you want to play this one.</div></div>
   ${opt('solo','user','Go solo','Keep it low-key and flexible.','var(--sand)')}
   ${opt('friends','users',"See who's interested",'See if your circles want to go, too.','var(--sand)')}
  </div>
  <button class="btn" data-act="hangContinue">Continue</button>
 </div>${nav()}`};

V.hangCircles=()=>{const nm=c=>{const m=c.members.map(k=>PEOPLE[k].name);return m.length?(m.length>3?m.slice(0,1).join('')+' + '+(m.length-1)+' more':m.join(', ')):'No one yet'};
 return `${status}<div class="body" style="gap:12px;padding-top:12px">
  ${hdr(backBtn)}
  ${title('Who are you open to seeing?','Only friends in selected circles can match with you for this event.')}
  <div class="card" style="display:flex;flex-direction:column;gap:12px">${S.circles.map(c=>{const on=S.hangCircle===c.id;const av=c.members.slice(0,3);return `<button class="pick ${on?'on':''}" data-hc="${c.id}" aria-pressed="${on}" style="height:67px">
    <span style="display:flex;width:74px;flex:none">${av.length?av.map((k,i)=>`<span class="av" style="width:30px;height:30px;border:2px solid #fffcfb;margin-left:${i?-8:0}px;background-image:${im(PEOPLE[k].img)}"></span>`).join(''):`<span style="width:30px;height:30px;border-radius:50%;background:${c.bg};display:grid;place-items:center">${ic('users',14)}</span>`}</span>
    <span style="flex:1;min-width:0"><b style="display:block;font:700 16px/21px var(--sans)">${c.name}</b><span style="font:400 13px/18px var(--sans);color:var(--mute)">${esc(nm(c))}</span></span>
    <span class="box ${on?'on':''}">${on?ic('check',14,2.5):''}</span></button>`}).join('')}</div>
  <div style="display:flex;gap:10px;align-items:center;background:var(--sage);border-radius:16px;padding:12px;font:400 13px/18px var(--sans);color:var(--nav)">${ic('lock',16)}Your interest stays private until mutual.</div>
  ${S.hangErr?`<p class="err">${esc(S.hangErr)}</p>`:''}
  <button class="btn" data-act="findMatch">Find a match</button>
 </div>${nav()}`};

V.match=()=>{const p=PLACES[S.place];if(S.matching)return `${status}<div class="body" style="justify-content:center;align-items:center;text-align:center;gap:16px">
  <h1 class="h1">Checking your circle…</h1><p class="sub" style="margin:0">Looking for someone who also wants to try ${p.name}.</p><div class="dots"><i></i><i></i><i></i></div></div>${nav()}`;
 const f=PEOPLE[S.matchWith];const c=S.circles.find(x=>x.id===S.hangCircle);
 return `${status}<div class="body" style="gap:16px;padding-top:16px">
  ${hdr(closeBtn)}
  <div><h1 class="h1" style="font-size:32px">It's a match!</h1><p class="sub">You and ${f.name} both want to try ${p.name}.</p></div>
  <div class="row" style="gap:26px">
   <span style="display:flex;flex-direction:column;align-items:center;gap:4px"><span class="av" style="width:60px;height:60px;background-image:${im('301ffc')}"></span><b style="font:700 12px/16px var(--sans);color:var(--ink2)">You</b></span>
   <span style="color:var(--plum);margin-top:-18px">${ic('heart',20)}</span>
   <span style="display:flex;flex-direction:column;align-items:center;gap:4px"><span class="av" style="width:60px;height:60px;background-image:${im(f.img)}"></span><b style="font:700 12px/16px var(--sans);color:var(--ink2)">${f.name}</b></span>
   <span class="badge" style="margin-top:-18px">${ic('users',14)}${c.name}</span>
  </div>
  <div class="card" style="display:flex;flex-direction:column;gap:8px"><div class="thumb" style="height:100px;border-radius:12px;background-image:${im(p.big)}"></div><div class="serif" style="font-size:23px;line-height:30px">${p.name}</div><div style="display:flex;gap:8px"><span class="chip" style="flex:1">${ic('clock',16)}Today, 3:30 PM</span><span class="chip" style="flex:1">${ic('map-pin',16)}${p.mins} min walk</span></div></div>
  <div style="display:flex;flex-direction:column;gap:4px"><button class="btn" data-act="confirmMeetup">Confirm meetup</button><button class="ghost" data-act="home">Not now</button></div>
 </div>${nav()}`};

V.meetup=()=>{const p=PLACES[S.place],f=PEOPLE[S.matchWith],c=S.circles.find(x=>x.id===S.hangCircle);return `${status}<div class="body" style="gap:18px;padding-top:28px">

const RAIL=[['Auth & onboarding',[['16','login','Login'],['21','interests','Choose Interests'],['22','onFriends','Choose Friends']]],
 ['Simple · explore & plan',[['01','home','Home'],['02','discover','Discover'],['03','explore','Expanded Card'],['04','confirmed','Confirmed']]],
 ['Spontaneous hangout',[['23','hangout','Solo or Friends'],['24','hangCircles','Choose Circles'],['25','match','Mutual Match'],['26','meetup','Meetup Confirmed']]],
 ['Moderate · budget',[['06','budget','Budget Overview'],['07','editBudget','Edit Budget'],['08','budgetDone','Updated']]],
 ['Complex · circles',[['09','friends','Friends List'],['10','circles','My Circles'],['11','editCircle','Edit Circle'],['12','circlesDone','Circles Updated']]],
 ['Profile',[['P1','profile','Profile & Your Map'],['P2','editInterests','Edit Interests']]]];
function renderRail(){document.getElementById('railList').innerHTML=RAIL.map(([g,items])=>`<div style="margin-bottom:12px"><h2>${g}</h2><ol>${items.map(([n,k,l])=>`<li><button data-jump="${k}" ${S.screen===k?'aria-current="true"':''}><span>${n}</span>${l}</button></li>`).join('')}</ol></div>`).join('')}
function render(anim){const ph=document.getElementById('phone');const focusId=document.activeElement&&document.activeElement.id;const sel=focusId&&document.activeElement.selectionStart;
 if(S.screen==='chat'&&!S.chatWith)S.chatWith=S.friends[0];
 if(S.screen==='editInterests'&&!S.intDraft)S.intDraft=[...S.interests];
 if(S.screen==='editCircle'&&!S.circleDraft)S.circleDraft=[...S.circles.find(c=>c.id===S.editCircle).members];
 if(S.screen==='match'&&!S.matchWith&&!S.matching)pickMatch();
 ph.innerHTML=`<div class="scr ${anim?'screen-in':''}">${V[S.screen]()}</div>${sheetHTML()}<div class="toast" id="toast" role="status"></div>`;
 if(focusId){const el=document.getElementById(focusId);if(el){el.focus();try{el.setSelectionRange(sel,sel)}catch(e){}}}
 const m=document.getElementById('msgs');if(m)m.parentElement.scrollTop=1e6;
 renderRail()}

function pickMatch(){const c=S.circles.find(x=>x.id===S.hangCircle);S.matchWith=c.members[Object.keys(PLACES).indexOf(S.place)%c.members.length]}

/* ---------- actions ---------- */
function addSpend(p){const amt=COST[p.price];if(!amt)return;const b=S.budget;b.spent.weekly[p.cat]+=amt;b.spent.monthly[p.cat]+=amt;b.spent.daily[p.cat]+=amt}
const A={
 back,home:()=>{S.hist=[];go('home');S.hist=[]},
 togglePw:()=>{S.showPw=!S.showPw;render()},
 login:()=>{const e=S.email.trim();if(!/^\S+@\S+\.\S+$/.test(e)){S.loginErr='Enter a valid email address.';return render()}if(!S.pw){S.loginErr='Enter your password.';return render()}S.loginErr='';S.hist=[];go('interests')},
 signup:()=>{S.loginErr='';go('interests')},
 forgot:()=>{S.sheet='forgot';render()},
 sendReset:()=>{const v=document.getElementById('fem').value.trim();if(!/^\S+@\S+\.\S+$/.test(v)){document.getElementById('ferr').hidden=false;return}S.email=v;S.sheet=null;render();toast('Reset link sent to '+v)},
 toFriends:()=>{if(!S.interests.length){S.intErr=true;return render()}S.intErr=false;go('onFriends')},
 finishOnboard:(el)=>{if(S.addMode){S.addMode=false;for(const k of S.onboardFriends)if(!S.friends.includes(k))S.friends.push(k);const n=S.onboardFriends.length;S.hist=[];go('friends');S.hist=[];if(n)toast(n+' friend'+(n>1?'s':'')+' added');return}if(!el.dataset.skip){for(const k of S.onboardFriends)if(!S.friends.includes(k))S.friends.push(k)}S.hist=[];go('home');S.hist=[];if(!el.dataset.skip&&S.onboardFriends.length)toast(S.onboardFriends.length+' friend'+(S.onboardFriends.length>1?'s':'')+' added')},
 toMap:()=>go('discover'),
 directions:()=>toast('Opening walking directions to '+PLACES[S.place].name),
 editInterests:()=>{S.intDraft=[...S.interests];S.intErr=false;go('editInterests')},
 saveInterests:()=>{if(!S.intDraft.length){S.intErr=true;return render()}S.interests=[...S.intDraft];S.intErr=false;back();toast('Interests updated')},
 friendsAdd:()=>{S.onboardFriends=[];S.friendQ='';S.addMode=true;go('onFriends')},
 filters:()=>{S.sheet='filters';render()},closeSheet:()=>{S.sheet=null;render()},
 clearFilters:()=>{S.filter={price:[],walk:15};S.mapQ='';render()},
 plan:()=>{S.mode='friends';go('hangout')},
 hangContinue:()=>{if(S.mode==='solo'){addSpend(PLACES[S.place]);S.visits.push({p:S.place,d:'Today'});S.plans.unshift({p:S.place,when:'Today · 3:00–4:00pm',cal:false});S.lastVisit=PLACES[S.place].name+' · Today 3:00pm';go('confirmed')}else{S.hangErr='';go('hangCircles')}},
 findMatch:()=>{const c=S.circles.find(x=>x.id===S.hangCircle);if(!c.members.length){S.hangErr=`No one is in ${c.name} yet. Pick another circle or add people in Circles.`;return render()}S.hangErr='';S.matchWith=null;S.matching=true;go('match');setTimeout(()=>{if(S.screen!=='match')return;S.matching=false;pickMatch();render(true)},1400)},
 confirmMeetup:()=>{addSpend(PLACES[S.place]);S.visits.push({p:S.place,d:'Today',w:S.matchWith});S.plans.unshift({p:S.place,when:'Today · 3:30pm',w:S.matchWith,cal:false});S.lastVisit=PLACES[S.place].name+' with '+PEOPLE[S.matchWith].name+' · 3:30pm';go('meetup')},
 calendar:()=>{S.lastVisit=PLACES[S.place].name+' · Today 3:00pm';const pl=S.plans.find(x=>x.p===S.place);if(pl)pl.cal=true;toast('Added to your calendar for 3:00pm')},
 share:()=>{const p=PLACES[S.place];const t=`I'm heading to ${p.name} today at 3pm (${p.mins} min walk). Join me?`;const done=()=>toast('Plan copied to clipboard');try{navigator.clipboard.writeText(t).then(done,()=>toast('Plan ready to share: '+p.name))}catch(e){toast('Plan ready to share: '+p.name)}},
 budget:()=>{S.hist=[];go('budget');S.hist=[]},
 editBudget:()=>{S.draft=null;S.customOpen=false;S.budErr=false;go('editBudget')},
 custom:()=>{S.customOpen=true;S.draft=null;render();setTimeout(()=>document.getElementById('customAmt')?.focus())},
 saveBudget:()=>{if(S.draft==null||!(S.draft>0)){S.budErr=true;return render()}S.lastSave=S.budget.amt[S.budget.freq];S.budget.amt[S.budget.freq]=S.draft;S.budErr=false;go('budgetDone',{replace:true})},
 circles:()=>{S.hist=[];go('circles');S.hist=[]},
 friendsTab:()=>{S.hist=[];go('friends');S.hist=[]},
 saveCircle:()=>{const c=S.circles.find(x=>x.id===S.editCircle);const d=S.circleDraft;for(const o of S.circles)if(o!==c)o.members=o.members.filter(k=>!d.includes(k));c.members=[...d];S.circleDraft=null;S.circleQ='';go('circlesDone',{replace:true})},
 logout:()=>{const keep=fresh();S=keep;render(true)},
};

const phone=document.getElementById('phone');
phone.addEventListener('click',e=>{const t=e.target;
 const bg=t.closest('.sheet-bg');if(bg&&!t.closest('[data-stop]')){S.sheet=null;return render()}
 const el=t.closest('button,[data-act],[data-place]');if(!el)return;const d=el.dataset;
 if(d.tab)return tab(d.tab);
 if(d.place){S.place=d.place;return go('explore')}
 if(d.int){const i=S.interests.indexOf(d.int);i<0?S.interests.push(d.int):S.interests.splice(i,1);S.intErr=false;return render()}
 if(d.of){const i=S.onboardFriends.indexOf(d.of);i<0?S.onboardFriends.push(d.of):S.onboardFriends.splice(i,1);return render()}
 if(d.mode){S.mode=d.mode;return render()}
 if(d.hc){S.hangCircle=d.hc;S.hangErr='';return render()}
 if(d.freq){S.budget.freq=d.freq;if(S.screen==='editBudget'){S.draft=null;S.customOpen=false}return render()}
 if(d.preset){S.draft=+d.preset;S.customOpen=false;S.budErr=false;return render()}
 if(d.step){const base=S.draft??S.budget.amt[S.budget.freq];S.draft=Math.max(5,Math.round((base+ +d.step)/5)*5);S.budErr=false;return render()}
 if(d.ec){S.editCircle=d.ec;S.circleDraft=null;S.circleQ='';return go('editCircle')}
 if(d.cm){const i=S.circleDraft.indexOf(d.cm);i<0?S.circleDraft.push(d.cm):S.circleDraft.splice(i,1);return render()}
 if(d.chat){S.chatWith=d.chat;return go('chat')}
 if(d.fp){const a=S.filter.price,i=a.indexOf(d.fp);i<0?a.push(d.fp):a.splice(i,1);return render()}
 if(d.fw){S.filter.walk=+d.fw;return render()}
 if(d.mv){S.mapView=d.mv;return render()}
 if(d.tog){S[d.tog]=!S[d.tog];render();return toast(d.tog==='calSync'?(S.calSync?'Calendar synced':'Calendar sync off'):(S.notif?'Nudges on':'Nudges off'))}
 if(d.addcal!=null&&d.addcal!==undefined&&d.addcal!==''){S.plans[+d.addcal].cal=true;render();return toast('Added to your calendar')}
 if(d.intd){const a=S.intDraft,i=a.indexOf(d.intd);i<0?a.push(d.intd):a.splice(i,1);S.intErr=false;return render()}
 if(d.act&&A[d.act]){e.preventDefault();return A[d.act](el)}
});
phone.addEventListener('input',e=>{const t=e.target;
 if(t.id==='em'){S.email=t.value;S.loginErr=''}
 else if(t.id==='pw'){S.pw=t.value;S.loginErr=''}
 else if(t.id==='fq'){S.friendQ=t.value;render()}
 else if(t.id==='mq'){S.mapQ=t.value;render()}
 else if(t.id==='cq'){S.circleQ=t.value;render()}
 else if(t.id==='customAmt'){const v=parseFloat(t.value.replace(/[^0-9.]/g,''));S.draft=isNaN(v)?null:Math.round(v*100)/100;S.budErr=false;render()}
});
phone.addEventListener('submit',e=>{e.preventDefault();
 if(e.target.id==='loginForm')return A.login();
 if(e.target.id==='chatForm'){const inp=document.getElementById('msg');const v=inp.value.trim();if(!v)return;const k=S.chatWith;S.chats[k].push({t:v,me:true});render();
  setTimeout(()=>{if(S.screen==='chat'&&S.chatWith===k){S.chats[k].push({t:['Sounds good!','I’m in. See you there.','Ha, love that.','Leaving in 10!'][S.chats[k].length%4],me:false});render()}},900)}
});
phone.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[data-place]')){e.preventDefault();S.place=e.target.dataset.place;return go('explore')}if(e.key==='Enter'&&e.target.id==='pw'){e.preventDefault();A.login()}});
document.getElementById('railList').addEventListener('click',e=>{const b=e.target.closest('[data-jump]');if(!b)return;const k=b.dataset.jump;
 if(k==='match'){S.matching=false;S.matchWith=null}
 if(k==='meetup'&&!S.matchWith)pickMatch();
 if(k==='editCircle'){S.circleDraft=null}
 if(k==='editBudget'){S.draft=null;S.customOpen=false;S.budErr=false}
 if(k==='editInterests'){S.intDraft=[...S.interests];S.intErr=false}
 if(k==='onFriends')S.addMode=false;
 S.hist=[];S.sheet=null;S.screen=k;render(true)});
document.getElementById('resetBtn').addEventListener('click',()=>{S=fresh();render(true);toast('Prototype reset')});

/* fit the phone to short desktop windows */
function fit(){const w=document.getElementById('wrap'),p=document.getElementById('phone');if(innerWidth<=500){w.style.width=w.style.height='';p.style.transform='';return}
 const s=Math.min(1,(innerHeight-40)/760);p.style.transform=`scale(${s})`;w.style.width=370*s+'px';w.style.height=760*s+'px'}
addEventListener('resize',fit);fit();
render();
</script>
