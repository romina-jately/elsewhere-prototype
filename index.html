    <script>
(async () => {
  try {
    const encoded = document.getElementById('elsewhere-bundle').textContent.replace(/\s/g, '');
    const bytes = Uint8Array.from(atob(encoded), char => char.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const {css, js} = JSON.parse(await new Response(stream).text());
    const styles = document.createElement('style');
    styles.textContent = css;
    document.head.append(styles);
    const script = document.createElement('script');
    script.textContent = js;
    document.body.append(script);
  } catch (error) {
    document.getElementById('root').textContent = 'Elsewhere could not load. Please refresh or try a current browser.';
    console.error('Elsewhere startup failed', error);
  }
})();
</script>
